name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy scipy pytest
      - name: Run tests
        run: python -m pytest
      - name: Validate dictionary
        run: python tools/validate.py
      - name: Check synonym status
        run: python tools/synonyms.py --check
      - name: Check docs and dictionary consistency
        run: python tools/check_consistency.py
      - name: Check branch scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python tools/check_scope.py "origin/$BASE_REF" "$HEAD_REF"
